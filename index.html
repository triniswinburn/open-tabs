<style>
:root{
  --bg:#F2F0F7; --ink:#1C1A2B; --muted:#6B6980; --line:rgba(28,26,43,.11);
  --accent:#8A5CFF;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:30px; --r-md:20px;
}
body[data-stage="landing"],body[data-stage="lobby"],body[data-stage="end"]{--accent:#8A5CFF}
body[data-stage="vote"]{--accent:#4F6BFF}
body[data-stage="reveal"]{--accent:#FF5C8A}
body[data-stage="warmup"]{--accent:#FF6B4A}
body[data-stage="deep"]{--accent:#FF9A2E}
body[data-stage="hot"]{--accent:#0FB5D6}
body[data-stage="closing"]{--accent:#19B59A}

*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--bg);min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;font-size:16px;line-height:1.5;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}

/* background wash */
.wash{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.wash i{position:absolute;border-radius:50%;filter:blur(110px);background-color:var(--accent);opacity:.36;transition:background-color 1.4s ease}
.wash i:nth-child(1){width:52vw;height:52vw;left:-14vw;top:-22vw}
.wash i:nth-child(2){width:44vw;height:44vw;right:-12vw;bottom:-20vw;opacity:.28}
.wash::after{content:"";position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* header */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:22px clamp(20px,4vw,48px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.08rem;letter-spacing:-.01em}
.brand svg{display:block}
.steps{display:flex;gap:10px;list-style:none;padding:0}
.steps li{width:86px;font-size:.75rem;color:var(--muted)}
.steps li::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:7px;transition:background-color .6s}
.steps li.done::before{background:var(--ink)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{background:var(--accent)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:16px}
.codechip{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:6px 14px;font-size:.85rem;display:flex;gap:8px;align-items:center;backdrop-filter:blur(8px)}
.codechip b{font-family:var(--display);font-weight:600;letter-spacing:.08em}
.meter{display:grid;gap:5px;width:130px;font-size:.72rem;color:var(--muted)}
.meter span{display:block;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter span i{display:block;height:100%;width:var(--p,0%);background:var(--accent);border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1),background-color .6s}

/* layout */
main{display:grid;place-items:center;padding:clamp(8px,2vw,32px) clamp(20px,4vw,48px)}
.wrap{width:100%;max-width:1040px}
.center{text-align:center}
.h1{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,5.2vw,4.5rem);line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
.h2{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,3.6vw,3rem);line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.lede{font-size:1.1rem;color:var(--muted);max-width:46ch;margin-top:18px}
.sub{color:var(--muted);margin-top:12px;max-width:56ch}
.center .sub,.center .lede{margin-left:auto;margin-right:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:14px 26px;font-weight:600;transition:transform .15s,opacity .2s,box-shadow .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.7)}
.btn.glow{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.sm{padding:9px 16px;font-size:.88rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.85rem;padding:6px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;align-items:center}
.wait{color:var(--muted);font-size:.95rem}

/* avatars, chips */
.av{display:block;flex:none}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:.88rem;font-weight:500;backdrop-filter:blur(8px);transition:opacity .3s,box-shadow .3s,transform .3s}
.pchip small{color:var(--muted);font-weight:400}
.pchip.off{opacity:.45}
.pchip.on{box-shadow:0 0 0 2px var(--accent);background:#fff;transform:scale(1.04)}
.pchip.me{border-color:var(--ink)}
button.pchip{cursor:pointer}
button.pchip.pick{box-shadow:0 0 0 2px var(--accent);background:#fff}

/* landing */
.landing{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
.hero svg.art{width:100%;max-width:440px;margin-top:36px;display:block;overflow:visible}
.art .edge{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-opacity:.5}
.panel{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:grid;gap:20px;backdrop-filter:blur(14px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(28,26,43,.06);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:10px;font-weight:500;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(28,26,43,.08)}
label,.lbl{display:grid;gap:8px;font-size:.85rem;font-weight:500;color:var(--muted)}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px 16px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:none;min-height:96px;line-height:1.4}
input.code{font-family:var(--display);font-weight:600;letter-spacing:.3em;text-transform:uppercase;font-size:1.3rem}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem;line-height:1}
.stepper output{font-family:var(--display);font-weight:600;font-size:1.6rem;min-width:2ch;text-align:center;color:var(--ink)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avs button{display:grid;justify-items:center;gap:3px;padding:8px 0 6px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:.66rem;color:var(--muted);transition:box-shadow .2s,transform .2s}
.avs button:hover{transform:translateY(-2px)}
.avs button.on{box-shadow:0 0 0 2px var(--ink);color:var(--ink);font-weight:600}
.avs button:disabled{opacity:.32;cursor:not-allowed;transform:none}
.avs button.taken span{font-style:italic}
.hintline{font-size:.8rem;font-weight:400;color:var(--muted)}
.you{font-size:.88rem;color:var(--ink);font-weight:500}
.slot small{color:var(--muted);margin-top:-6px}
.err{color:#B3261E;font-size:.9rem}
.demo{grid-column:1/-1;font-size:.82rem;color:var(--muted);max-width:70ch}

/* lobby */
.slots{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:34px 0 8px}
.slot{width:104px;display:grid;justify-items:center;gap:8px;font-size:.85rem}
.slot .disc{width:68px;height:68px;border-radius:24px;display:grid;place-items:center;background:rgba(255,255,255,.85);border:1px solid var(--line)}
.slot.empty .disc{background:transparent;border:1.5px dashed rgba(28,26,43,.25)}
.slot.empty span{color:var(--muted)}
.bigcode{font-family:var(--display);font-weight:700;font-size:clamp(3rem,9vw,6.4rem);letter-spacing:.14em;line-height:1;margin:22px 0 4px;padding-left:.14em}
.plan{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px;color:var(--muted);font-size:.88rem}
.plan span{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.55)}

/* vote */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:180px;padding:20px;border-radius:var(--r-lg);background:rgba(255,255,255,.8);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,background-color .2s,border-color .2s;backdrop-filter:blur(8px)}
.tcard:hover{transform:translateY(-3px)}
.tcard.on{background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.glyph{width:34px;height:34px;color:var(--accent);margin-bottom:auto;display:block}
.tname{font-family:var(--display);font-weight:600;font-size:1.28rem;letter-spacing:-.02em;line-height:1.1}
.ttag{font-size:.85rem;color:var(--muted);line-height:1.35}
.tdots{display:flex;gap:4px;min-height:10px;margin-top:6px;flex-wrap:wrap}
.tdots i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pop .3s}
.votebar{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:28px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.pips{display:flex;gap:6px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.pips i.full{background:var(--accent)}

/* reveal */
.spinwrap{min-height:46vh;display:grid;place-content:center;gap:16px;text-align:center}
.spin{font-family:var(--display);font-weight:600;font-size:clamp(2.6rem,8vw,6.5rem);letter-spacing:-.04em;line-height:1}
.spin.tick{animation:tick .18s ease-out}
.landed-theme .glyph{width:64px;height:64px;margin:0 auto 18px}
.landed-theme .spin{animation:land .7s cubic-bezier(.2,1.3,.3,1)}
.tiebadge{display:inline-block;margin:0 auto;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}

/* warm-up */
.prompt{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,2.6vw,2.1rem);letter-spacing:-.02em;margin-top:6px}
.metaline{display:flex;gap:14px;justify-content:center;align-items:center;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.choice{--pct:0%;position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-height:240px;padding:26px;border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(255,255,255,.82);transition:transform .2s,box-shadow .2s;backdrop-filter:blur(8px);overflow:hidden}
.choice:hover:not(:disabled){transform:translateY(-3px)}
.choice.on{box-shadow:0 0 0 2px var(--accent);background:#fff}
.choice:disabled{cursor:default}
.choice.res{background:linear-gradient(to top,color-mix(in srgb,var(--accent) 24%,white) var(--pct),rgba(255,255,255,.85) var(--pct));transition:background .6s}
.choice .ct{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.05;letter-spacing:-.03em}
.choice .who{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;align-items:center;font-size:.85rem;color:var(--muted)}
.choice .num{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--ink);margin-right:6px}
.nudge{margin-top:24px;text-align:center;font-family:var(--display);font-size:1.25rem;letter-spacing:-.01em;animation:rise .5s both}

/* deep dive */
.deephead{display:flex;justify-content:center;gap:14px;align-items:center;color:var(--muted);font-size:.9rem}
.landed{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap;font-size:1.05rem}
.qcard{margin:20px auto 0;max-width:820px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:36px;padding:clamp(28px,4vw,52px);text-align:center;backdrop-filter:blur(10px)}
.qcard.drop{animation:drop .8s cubic-bezier(.2,.9,.25,1.05) both}
.q{font-family:var(--display);font-weight:500;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.1;letter-spacing:-.025em;text-wrap:balance}
.q.small{font-size:1rem;color:var(--muted);font-family:var(--ui);letter-spacing:0;margin-bottom:18px}
.hint{text-align:center;color:var(--muted);margin:18px auto 0;font-size:.95rem;max-width:56ch}
.passgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 18px}
.passbox{max-width:520px;margin:0 auto;display:grid;gap:14px;text-align:left}

/* hot or not */
.rates{display:flex;gap:14px;justify-content:center;margin-top:30px}
.rate{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.88);font-family:var(--display);font-weight:600;font-size:1.5rem;transition:transform .2s,background-color .2s,color .2s,box-shadow .2s}
.rate:hover{transform:translateY(-3px)}
.rate.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scalelab{display:flex;justify-content:space-between;width:min(100%,calc(5*68px + 4*14px));margin:12px auto 0;font-size:.85rem;color:var(--muted);padding:0 14px}
.avg{display:grid;justify-items:center;margin-top:26px}
.avg b{font-family:var(--display);font-weight:600;font-size:clamp(3rem,7vw,5rem);letter-spacing:-.04em;line-height:1}
.avg span{color:var(--muted);font-size:.9rem}
.dist{display:grid;grid-template-columns:repeat(5,92px);column-gap:12px;row-gap:8px;justify-content:center;margin-top:18px}
.dcol{display:grid;grid-row:span 3;grid-template-rows:subgrid;justify-items:center;width:92px;row-gap:8px}
.dav{align-self:end;display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:4px;width:92px;min-height:64px}
.dnum{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:600}
.dnames{font-size:.72rem;color:var(--muted);line-height:1.25;min-height:2.5em}

/* closing */
.compose{max-width:620px;margin:30px auto 0;display:grid;gap:14px}
.count{font-size:.78rem;color:var(--muted);text-align:right}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:40px}
.note{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:26px;padding:20px 22px;display:grid;gap:10px;animation:rise .5s both}
.note .to{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.note p{font-family:var(--display);font-size:1.2rem;line-height:1.2;letter-spacing:-.015em}
.note small{color:var(--muted)}

/* summary */
.summary{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:40px;padding:clamp(26px,4vw,52px);display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;backdrop-filter:blur(12px)}
.badges{display:grid;gap:10px;margin-top:26px}
.badge{display:flex;align-items:center;gap:12px}
.badge b{font-weight:600}
.badge small{display:block;color:var(--muted);font-size:.82rem;line-height:1.2}
.summary svg.cons{width:100%;max-width:320px;margin:0 auto;display:block}

/* footer */
footer{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:18px clamp(20px,4vw,48px) 24px}
.roster{display:flex;flex-wrap:wrap;gap:8px;max-width:760px}
svg.cons .edge{fill:none;stroke:var(--accent);stroke-opacity:.55;stroke-linecap:round;transition:stroke-width .6s}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* motion */
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tick{from{opacity:.2;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes land{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{0%{transform:translateY(-90px) rotate(-2.5deg);opacity:0}55%{transform:translateY(10px) rotate(.8deg);opacity:1}100%{transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fresh .art .edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards;animation-delay:var(--d,0s)}
.fresh .art .node{animation:land .6s cubic-bezier(.2,1.3,.3,1) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .landing,.summary{grid-template-columns:1fr}
  .tgrid{grid-template-columns:repeat(2,1fr)}
  header{grid-template-columns:1fr auto}
  .steps{display:none}
  .meter{display:none}
  .pair{grid-template-columns:1fr}
  .rate{width:54px;height:54px}
  .rates{gap:8px}
  .dist{grid-template-columns:repeat(5,60px);column-gap:6px}
  .dcol{width:60px}
  .dav{width:60px}
  footer .cons{display:none}
}
</style>
</head>

function seeded(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }

}

/* ---------------- sync layer ---------------- */
function setAt(obj, parts, val){
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++){ if (typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const k = parts[parts.length - 1];
  if (val === null || val === undefined) delete o[k]; else o[k] = val;
}
function applyUpdates(state, updates){
  state = state || {};
  for (const [p, v] of Object.entries(updates)) setAt(state, p.split("/").filter(Boolean), v);
  return state;
}
function demoTransport(){
  const key = c => "cg:room:" + c;
  const read = c => { try { return JSON.parse(localStorage.getItem(key(c))); } catch { return null; } };
  return {
    async get(c){ return read(c); },
    async update(c, u){ localStorage.setItem(key(c), JSON.stringify(applyUpdates(read(c), u))); },
    subscribe(c, cb){
      const h = e => { if (e.key === key(c)) cb(read(c)); };
      addEventListener("storage", h); cb(read(c));
      return () => removeEventListener("storage", h);
    }
  };
}
function fbTransport(base){
  base = base.replace(/\/+$/, "");
  const url = c => `${base}/rooms/${c}.json`;
  return {
    async get(c){ const r = await fetch(url(c)); if (!r.ok) throw new Error("net"); return r.json(); },
    async update(c, u){
      const r = await fetch(url(c), {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(u)});
      if (!r.ok) throw new Error("net");
    },
    subscribe(c, cb){
      let state = null;
      const es = new EventSource(url(c));
      const apply = (path, data, merge) => {
        const parts = path.split("/").filter(Boolean);
        if (merge){ for (const [k, v] of Object.entries(data || {})) state = applyUpdates(state, {[[...parts, k].join("/")]: v}); }
        else if (!parts.length) state = data;
        else state = applyUpdates(state, {[parts.join("/")]: data});
      };
      es.addEventListener("put", e => { const m = JSON.parse(e.data); apply(m.path, m.data, false); cb(state); });
      es.addEventListener("patch", e => { const m = JSON.parse(e.data); apply(m.path, m.data, true); cb(state); });
      return () => es.close();
    }
  };
}

/* ---------------- room lifecycle ---------------- */
const CODE_CHARS = "BCDFGHJKLMNPQRSTVWXZ";
const makeCode = () => Array.from({length:4}, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const inviteLink = () => location.href.split(/[?#]/)[0] + "?room=" + me.code;

let lookupSeq = 0;
async function lookupRoom(){
  const code = (ui.f.code || "").trim().toUpperCase();
  if (code.length !== 4){ if (ui.taken.length || ui.room){ ui.taken = []; ui.room = null; render(); } return; }
  const seq = ++lookupSeq;
  try {
    const room = await T.get(code);
    if (seq !== lookupSeq) return;
    const ok = !!(room && room.hostId);
    ui.taken = ok ? Object.values(room.players || {}).map(p => p.av) : [];
    ui.room = {code, ok};
    if (ui.taken.includes(ui.form.av)) ui.form.av = ALL_AV.find(i => !ui.taken.includes(i)) ?? ui.form.av;
    render();
  } catch {}
}
async function createRoom(){
  const f = ui.f;
  if (!f.name.trim()) return setErr("Add your name first.");
  ui.busy = true; setErr("");
  try {
    let code = makeCode();
    for (let i = 0; i < 8; i++){ if (!(await T.get(code))) break; code = makeCode(); }
    const pid = rid();
    await T.update(code, {hostId:pid, expected:ui.form.expected, stage:"lobby", created:Date.now(), players:{[pid]:{name:f.name.trim().slice(0, 20), av:ui.form.av, at:Date.now(), seen:Date.now()}}});
    enter(code, pid);
  } catch { setErr("Couldn’t reach the server. Check your connection and try again."); }
  ui.busy = false; render();
}
async function joinRoom(){
  const f = ui.f, code = f.code.trim().toUpperCase();
  if (!code) return setErr("Enter the room code from your host.");
  if (!f.name.trim()) return setErr("Add your name first.");
  ui.busy = true; setErr("");
  try {
    const room = await T.get(code);
    if (!room || !room.hostId){ setErr("We couldn’t find that room. Check the code with your host."); ui.busy = false; return render(); }
    const name = f.name.trim().slice(0, 20), ps = Object.entries(room.players || {});
    const again = ps.find(([, p]) => p.name.toLowerCase() === name.toLowerCase());
    let pid;
    if (again){ pid = again[0]; await T.update(code, {[`players/${pid}/seen`]:Date.now()}); }
    else {
      if (ps.length >= 18){ setErr("This room is full (18 people)."); ui.busy = false; return render(); }
      const taken = ps.map(([, p]) => p.av);
      if (taken.includes(ui.form.av)){
        ui.taken = taken; ui.room = {code, ok:true};
        ui.form.av = ALL_AV.find(i => !taken.includes(i)) ?? ui.form.av;
        setErr("Someone just picked that animal. We chose another one for you. Check it and join again.");
        ui.busy = false; return render();
      }
      const avi = ui.form.av;
      pid = rid();
      await T.update(code, {[`players/${pid}`]:{name, av:avi, at:Date.now(), seen:Date.now()}});
    }
    enter(code, pid);
  } catch { setErr("Couldn’t reach the server. Check your connection and try again."); }
  ui.busy = false; render();
}
function enter(code, pid){
  me = {code, pid};

function connect(){

function ping(){

}

/* ---------------- game logic ---------------- */
function toggleVote(id){
  const mine = myVotes();
  if (mine.includes(id)) commit({[`votes/${me.pid}/${id}`]:null});
  else if (mine.length < 2) commit({[`votes/${me.pid}/${id}`]:true});
  else toast("Both votes are used. Click a topic you picked to take the vote back.");
}
function revealWinner(){
  const t = tallies(), max = Math.max(0, ...Object.values(t));
  const top = THEMES.filter(x => (t[x.id] || 0) === max).map(x => x.id);
  const winner = top[Math.floor(Math.random() * top.length)];
  commit({stage:"reveal", theme:winner, tie:top.length > 1 ? top : null, revealAt:Date.now()});
}
function pickPeople(n, exclude = []){
  const ps = players();
  let pool = ps.filter(p => present(p.id) && !exclude.includes(p.id));
  if (pool.length < n) pool = ps.filter(p => !exclude.includes(p.id));
  const sp = S.spoken || {};
  return shuffle(pool, Math.random).sort((a, b) => (sp[a.id] || 0) - (sp[b.id] || 0)).slice(0, n).map(p => p.id);
}
function roundUpdates(r, qi){
  if (r >= ROUNDS) return {stage:"hot", h:{i:0, revealed:false}};
  let mode = MODES[r % MODES.length];
  if (mode === "pair" && players().length < 2) mode = "spark";
  const d = {r, qi, mode, phase:"answer"};
  const u = {};
  if (mode === "all"){ u.deep = d; return u; }
  const ids = pickPeople(mode === "pair" ? 2 : 1);
  d.turn = ids[0];
  u[`spoken/${ids[0]}`] = (S.spoken?.[ids[0]] || 0) + 1;
  if (mode === "pair" && ids[1]){
    d.partner = ids[1];
    u[`spoken/${ids[1]}`] = (S.spoken?.[ids[1]] || 0) + 1;
    u[`links/${rid("l")}`] = {from:ids[0], to:ids[1], kind:"pair"};
  }
  u.deep = d;
  return u;
}
const canAct = () => { const d = S.deep; return isHost() || (d.mode !== "all" && (me.pid === d.turn || me.pid === d.partner)); };

function act(a, arg){
  switch (a){
    case "tab": ui.tab = arg; ui.err = ""; render(); if (arg === "join") lookupRoom(); break;
    case "av": if (ui.tab === "join" && ui.taken.includes(+arg)) break; ui.form.av = +arg; render(); break;
    case "exp": ui.form.expected = Math.min(18, Math.max(2, ui.form.expected + +arg)); render(); break;
    case "create": createRoom(); break;
    case "join": joinRoom(); break;
    case "copyLink": copy(inviteLink()); toast("Invite link copied"); break;
    case "copyCode": copy(me.code); toast("Room code copied"); break;
    case "leave": leave(); break;
    case "start": commit({stage:"vote"}); break;
    case "vote": toggleVote(arg); break;
    case "reveal": revealWinner(); break;
    case "toWarm": commit({stage:"warmup", w:{i:0, revealed:false}}); break;
    case "pick": if (!S.w.revealed) commit({[`answers/q${S.w.i}/${me.pid}`]:arg}); break;
    case "showRes": commit({"w/revealed":true}); break;
    case "nextPair": {
      const i = S.w.i;
      if (i < THEME(S.theme).pairs.length - 1) commit({w:{i:i + 1, revealed:false}});
      else commit({stage:"deep", ...roundUpdates(0, 0)});

/* ---------------- derived: meter, constellation, badges ---------------- */
function meter(){
  if (!S) return 0;
  const N = Math.max(players().length, 1);
  let pts = 0;
  for (const v of Object.values(S.votes || {})) pts += Object.keys(v || {}).length;
  for (const q of Object.values(S.answers || {})) pts += Object.keys(q || {}).length;
  for (const q of Object.values(S.rates || {})) pts += Object.keys(q || {}).length;
  pts += Object.keys(S.links || {}).length * 2 + Object.keys(S.notes || {}).length * 2;
  if (S.deep) pts += (S.deep.r || 0) * 2;
  return Math.min(1, pts / (N * 16));
}
function constellation(size){
  const ps = players(), n = ps.length, c = size / 2, R = size * 0.36, ns = size * 0.12;
  const pos = {};
  ps.forEach((p, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(n, 1); pos[p.id] = [c + (n > 1 ? R * Math.cos(a) : 0), c + (n > 1 ? R * Math.sin(a) : 0)]; });
  const w = {};
  const add = (f, t) => { if (!pos[f] || !pos[t] || f === t) return; const k = [f, t].sort().join("|"); w[k] = (w[k] || 0) + 1; };
  Object.values(S.links || {}).forEach(l => add(l.from, l.to));
  Object.values(S.notes || {}).forEach(l => add(l.from, l.to));
  const lines = Object.entries(w).map(([k, v]) => { const [a, b] = k.split("|"); return `<line class="edge" x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" stroke-width="${1 + Math.min(v, 5) * 0.9}"/>`; }).join("");
  const nodes = ps.map(p => `<g transform="translate(${pos[p.id][0] - ns / 2} ${pos[p.id][1] - ns / 2}) scale(${ns / 32})" style="color:${COLORS[p.av % 18]}"><title>${esc(p.name)}</title>${shape(p.av)}</g>`).join("");
  return `<svg class="cons" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Connections between team members"><circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="rgba(28,26,43,.1)" stroke-dasharray="2 6"/>${lines}${nodes}</svg>`;
}
function stats(){
  const ps = players(), st = {};
  ps.forEach(p => st[p.id] = {turns:S.spoken?.[p.id] || 0, asks:0, passes:0, minority:0, got:0, sent:0});
  Object.values(S.links || {}).forEach(l => { if (!st[l.from]) return; if (l.kind === "spark"){ st[l.from].passes++; if (l.ask) st[l.from].asks++; } else st[l.from].passes++; });
  Object.values(S.notes || {}).forEach(n => { if (st[n.from]) st[n.from].sent++; if (st[n.to]) st[n.to].got++; });
  Object.values(S.answers || {}).forEach(q => {
    const vals = Object.values(q || {}), a = vals.filter(v => v === "a").length, b = vals.filter(v => v === "b").length;
    if (a === b) return;
    Object.entries(q || {}).forEach(([pid, v]) => { if (st[pid] && ((v === "a" && a < b) || (v === "b" && b < a))) st[pid].minority++; });
  });
  Object.values(S.rates || {}).forEach(q => {
    const e = Object.entries(q || {}); if (e.length < 3) return;
    const avg = e.reduce((a, [, v]) => a + +v, 0) / e.length;
    e.forEach(([pid, v]) => { if (st[pid] && Math.abs(+v - avg) >= 1.5) st[pid].minority++; });
  });
  return st;
}
const BADGES = [
  ["The storyteller","Spoke the most", s => s.turns],
  ["The curious one","Asked the follow-up questions", s => s.asks],
  ["The wild card","Often picked the other side", s => s.minority],
  ["The connector","Kept the spark moving", s => s.passes],
  ["The MVP","Got the most thanks", s => s.got],
  ["The cheerleader","Wrote the most thank-you notes", s => s.sent]
];
function badges(){
  const ps = players(), st = stats(), taken = new Set(), out = {};
  for (const [name, desc, fn] of BADGES){
    const best = ps.filter(p => !taken.has(p.id)).sort((a, b) => fn(st[b.id]) - fn(st[a.id]))[0];
    if (best && fn(st[best.id]) > 0){ out[best.id] = [name, desc]; taken.add(best.id); }
  }
  ps.forEach(p => { if (!out[p.id]) out[p.id] = ["The calm one","Kept the team relaxed"]; });
  return out;
}
function counts(){
  return {people:players().length, cards:Math.min(S.deep?.r != null ? S.deep.r + 1 : 0, ROUNDS), sparks:Object.values(S.links || {}).filter(l => l.kind === "spark").length, notes:Object.keys(S.notes || {}).length};
}
function summaryText(){
  const th = THEME(S.theme), b = badges(), c = counts();
  return `Open tabs: ${th?.name || ""}\n${c.people} people, ${c.cards} cards, ${c.sparks} sparks, ${c.notes} notes\n\n` + players().map(p => `${p.name}: ${b[p.id][0]}`).join("\n");
}

      const mx = Math.max(...vals.map(v => v[1])), mn = Math.min(...vals.map(v => v[1]));
      if (mx === mn) nudge = `Everyone gave a ${mx}. Can anyone argue the other side?`;
      else if (mx - mn >= 2) nudge = `${names(vals.filter(v => v[1] === mx).map(v => v[0]))} gave ${mx}. ${names(vals.filter(v => v[1] === mn).map(v => v[0]))} gave ${mn}. Can you explain your ratings?`;
      else nudge = "The team mostly agrees. Who can argue the other side?";
    }
  }
  const scale = [1,2,3,4,5].map(n => `<button class="rate ${mine === n ? "on" : ""}" data-act="rate" data-arg="${n}" aria-label="Rate ${n} of 5" aria-pressed="${mine === n}">${n}</button>`).join("");
  const dist = [1,2,3,4,5].map(n => { const who = vals.filter(v => v[1] === n).map(v => v[0]); return `<div class="dcol"><div class="dav">${who.map(p => `<span title="${esc(p.name)}">${av(p.av, 26)}</span>`).join("")}</div><div class="dnum">${n}</div><div class="dnames">${who.map(p => esc(p.name)).join(", ")}</div></div>`; }).join("");
  return `<div class="wrap center ${fresh ? "fresh" : ""}">
    <div class="metaline"><span class="pill">Hot or not</span><span>Statement ${i + 1} of ${HOT_N}</span></div>
    <article class="qcard ${fresh && !revealed ? "drop" : ""}" style="margin-top:18px"><p class="q">${esc(text)}</p></article>
    ${revealed
      ? `<div class="avg"><b>${vals.length ? avg.toFixed(1) : "-"}</b><span>team average</span></div><div class="dist">${dist}</div><p class="nudge">${nudge}</p>`
      : `<div class="rates">${scale}</div><div class="scalelab"><span>Not</span><span>Hot</span></div><p class="hint">${rated} of ${ps.length} have rated. Pick a number from 1 (not) to 5 (hot).</p>`}
    <div class="actions">
      ${isHost()
        ? (revealed ? `<button class="btn glow" data-act="nextHot">${i >= HOT_N - 1 ? "Go to the closing" : "Next statement"}</button>` : `<button class="btn ${rated === ps.length ? "glow" : ""}" data-act="showHot" ${rated === 0 ? "disabled" : ""}>Show results</button>`)
        : `<p class="wait">${nm(S.hostId)} moves things along.</p>`}
    </div>
    ${isHost() ? `<div class="actions" style="margin-top:6px"><button class="linkbtn" data-act="toClosing">Skip to the closing</button></div>` : ""}
  </div>`;
}

function viewClosing(fresh){
  const ps = players().filter(p => p.id !== me.pid);
  const notes = Object.values(S.notes || {}).sort((a, b) => (a.t || 0) - (b.t || 0));
  const ok = ui.noteTo && ui.f.note.trim();
  return `<div class="wrap center ${fresh ? "fresh" : ""}">
    <h1 class="h2">Say thanks.</h1>
    <p class="sub">Write one short line to a teammate. Thank them for something they did or taught you.</p>
    <div class="compose">
      <div class="passgrid" style="margin:0">${ps.map(p => `<button class="pchip ${ui.noteTo === p.id ? "pick" : ""}" data-act="noteTo" data-arg="${p.id}">${av(p.av, 22)}<span>${esc(p.name)}</span></button>`).join("")}</div>
      <textarea data-keep="note" maxlength="140" placeholder="What would you like to say?">${esc(ui.f.note)}</textarea>
      <div class="count" id="noteCount">${ui.f.note.length}/140</div>
      <div class="actions" style="margin-top:0"><button class="btn" id="sendNote" data-act="sendNote" ${ok ? "" : "disabled"}>Send note</button></div>
    </div>
    ${notes.length ? `<div class="wall">${notes.map(n => `<div class="note"><div class="to">${P(n.to) ? av(P(n.to).av, 22) : ""}<span>To ${nm(n.to)}</span></div><p>${esc(n.text)}</p><small>From ${nm(n.from)}</small></div>`).join("")}</div>` : ""}
    <div class="actions">${isHost() ? `<button class="btn ghost" data-act="finish">Finish the session</button>` : ""}</div>
  </div>`;
}

function viewEnd(fresh){
  const th = THEME(S.theme), b = badges(), c = counts();
  return `<div class="wrap ${fresh ? "fresh" : ""}">
    <div class="summary">
      <div>
        ${th ? glyph(themeIdx(th.id)) : ""}
        <h1 class="h2" style="margin-top:14px">That’s a wrap.</h1>
        <p class="sub">${esc(th?.name || "")}: ${c.people} ${c.people === 1 ? "person" : "people"}, ${c.cards} ${c.cards === 1 ? "card" : "cards"}, ${c.sparks} ${c.sparks === 1 ? "spark" : "sparks"} passed and ${c.notes} thank-you ${c.notes === 1 ? "note" : "notes"}.</p>
        <div class="badges">${players().map(p => `<div class="badge">${av(p.av, 30)}<div><b>${esc(p.name)}</b> <span style="color:var(--muted);font-size:.82rem">the ${animalName(p.av)}</span><small>${b[p.id][0]}. ${b[p.id][1]}.</small></div></div>`).join("")}</div>
        <div class="actions" style="justify-content:flex-start"><button class="btn" data-act="copySummary">Copy summary</button><button class="btn ghost" data-act="leave">Leave room</button></div>
      </div>
      ${constellation(300)}
    </div>
    <p class="hint">Take a screenshot to remember this one.</p>
  </div>`;
}

function viewRoom(fresh){
  if (!S) return `<div class="wrap center"><p class="lede" style="margin-inline:auto">Connecting…</p></div>`;
  switch (S.stage){
    case "lobby": return viewLobby(fresh);
    case "vote": return viewVote(fresh);
    case "reveal": return viewReveal(fresh);
    case "warmup": return viewWarmup(fresh);
    case "deep": return viewDeep(fresh);
    case "hot": return viewHot(fresh);
    case "closing": return viewClosing(fresh);
    case "end": return viewEnd(fresh);
  }
  return "";
}
function viewKey(){
  if (ui.mode === "landing") return "landing" + ui.tab;
  if (!S) return "connecting";
  const d = S.deep || {};
  return [S.stage, S.w?.i, S.w?.revealed, S.h?.i, S.h?.revealed, d.r, d.qi, d.phase, d.turn].join("|");
}

/* ---------------- render ---------------- */
function setHTML(el, html){
  if (el._h === html) return;
  const a = document.activeElement;
  let keep = null;
  if (a && el.contains(a) && a.dataset?.keep) keep = {id:a.dataset.keep, s:a.selectionStart, e:a.selectionEnd};
  const vals = {};
  el.querySelectorAll("[data-keep]").forEach(n => vals[n.dataset.keep] = n.value);
  el.innerHTML = html; el._h = html;
  el.querySelectorAll("[data-keep]").forEach(n => { if (vals[n.dataset.keep] !== undefined) n.value = vals[n.dataset.keep]; });
  if (keep){ const n = el.querySelector(`[data-keep="${keep.id}"]`); if (n){ n.focus(); try { n.setSelectionRange(keep.s, keep.e); } catch {} } }
}
let lastKey = "";
function render(){
  if (ui.animating) return;
  const inRoom = ui.mode === "room" && S;
  const stage = ui.mode === "landing" ? "landing" : (S?.stage || "lobby");
  document.body.dataset.stage = stage;
  const key = viewKey(), fresh = key !== lastKey; lastKey = key;

  // header
  const idx = STAGE_IDX[stage] ?? -1;
  const steps = inRoom ? `<ol class="steps" aria-label="Session progress">${STAGES.map(([id, label], i) => `<li class="${i < idx ? "done" : i === idx ? "now" : ""}">${label}</li>`).join("")}</ol>` : "<div></div>";
  const right = inRoom ? `<div class="right"><div class="meter"><span><i style="--p:${Math.round(meter() * 100)}%"></i></span>Team connection</div><button class="codechip" data-act="copyCode" title="Copy room code">Room <b>${esc(me.code)}</b></button></div>` : "<div></div>";
  setHTML($("#top"), `<div class="brand"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><rect x="8" y="1.5" width="20" height="13" rx="4" fill="none" stroke="#1C1A2B" stroke-opacity=".3" stroke-width="1.4"/><rect x="4.5" y="5" width="20" height="13" rx="4" fill="#fff" stroke="#1C1A2B" stroke-opacity=".55" stroke-width="1.4"/><rect x="1" y="9" width="20" height="13" rx="4" style="fill:var(--accent);transition:fill .6s"/></svg>Open tabs</div>${steps}${right}`);

  // main
  setHTML($("#main"), ui.mode === "landing" ? viewLanding(fresh) : viewRoom(fresh));
  if (inRoom && S.stage === "reveal" && !(ui.revealedFor === S.revealAt || reduced) && ui.revealStarted !== S.revealAt) startReveal();
  if (inRoom && S.stage === "reveal" && reduced) ui.revealedFor = S.revealAt;

  // footer
  if (inRoom){
    const d = S.deep || {}, act = S.stage === "deep" ? (d.mode === "all" ? players().map(p => p.id) : [d.turn, d.partner].filter(Boolean)) : [];
    const roster = players().map(p => chip(p, `${act.includes(p.id) ? "on" : ""} ${present(p.id) ? "" : "off"} ${p.id === me.pid ? "me" : ""}`).replace("</span></span>", `</span>${p.id === S.hostId ? " <small>host</small>" : ""}</span>`)).join("");
    setHTML($("#foot"), `<div class="roster">${roster}</div>${constellation(176)}`);
  } else setHTML($("#foot"), "");
}

/* ---------------- boot ---------------- */
(function boot(){
  const q = new URLSearchParams(location.search).get("room");
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem("cg:me")); } catch {}
  if (saved && saved.code && (!q || q.toUpperCase() === saved.code)){ me = saved; ui.mode = "room"; connect(); }
  else if (q){ ui.tab = "join"; ui.f.code = q.toUpperCase().slice(0, 4); }
  render();
  if (ui.mode === "landing" && ui.f.code) lookupRoom();
})();
</script>
</body>
</html>
